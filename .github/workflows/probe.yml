name: Probe
on:
  push:
    branches: [arena/01a091e0-test]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          java -version 2>&1 | head -1
          echo "ANDROID_HOME=${ANDROID_HOME:-none}"
          ls "$ANDROID_HOME/ndk" 2>/dev/null
          curl -s -o /dev/null -m 15 -w "maven %{http_code}\n" https://repo1.maven.org/maven2/
          curl -s -o /dev/null -m 15 -w "google %{http_code}\n" https://dl.google.com/android/repository/repository2-3.xml
          nproc; free -g | head -2 | tail -1
